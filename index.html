<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/wini99-flutter/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- 2026-11-22 (v1.4.93): the standard mobile viewport meta was
       missing entirely — without it some WebViews fall back to a
       wide layout viewport. No viewport-fit=cover on purpose: the
       page must NOT extend into the notch / system-nav areas. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="wini99">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>wini99</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- v1.4.19: instant splash — the page used to be plain white until
       the engine (2.9MB JS + 7MB CanvasKit WASM) downloaded and booted,
       which took 20-60s on the user's phone. This pure HTML/CSS splash
       paints immediately, so the wait shows the brand instead of a blank
       page. Flutter's first frame covers it. -->
  <div id="splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffffff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
    <!-- v1.4.30: the client's new logo — full lockup (red W + wini99.com bar). Was gradient WINI99 text. -->
    <img src="logo-lockup.png" alt="wini99" style="width:210px;max-width:62vw;height:auto;" />
    <div style="margin-top:18px;width:36px;height:36px;border:4px solid #FBE3E3;border-top-color:#FF5A5A;border-radius:50%;animation:spin 0.9s linear infinite;"></div>
    <div style="margin-top:16px;font-size:14px;color:#7E6FA3;">Loading…</div>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
